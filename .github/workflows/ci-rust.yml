name: CI (Rust)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Public tree check
        run: scripts/check-public-tree.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Check
        run: cargo check --all-targets

      - name: Test
        # Serial: the crate keeps scan settings in process-wide state (skip set, index_documents), so
        # parallel test threads race on them. Slice 5 makes that state explicit.
        run: cargo test -- --test-threads=1

      # Reported, not enforced, until the dead-code removal lands; then restore `-D warnings`.
      - name: Clippy
        run: cargo clippy --all-targets

      - name: Format
        run: cargo fmt --check
